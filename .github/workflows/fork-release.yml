name: Folder Camera APK and Windows release
on:
  workflow_dispatch:
  push:
    tags: ['folder-camera-v*']
    branches: [master]
    paths: ['.github/workflows/fork-release.yml']

permissions:
  contents: read

concurrency:
  group: folder-camera-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/master' }}

jobs:
  android:
    if: github.repository == 'Aleks1496/folder-camera'
    runs-on: [self-hosted, linux, folder-camera]
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --max-workers=4
      - name: Build a test APK for a manual run
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'branch'
        run: |
          ./gradlew :app:assembleDebug --no-daemon --max-workers=4
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/folder-camera-test.apk"
      - name: Build and verify signed APK
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          KEYSTORE_BASE64: ${{ secrets.FOLDER_CAMERA_KEYSTORE_BASE64 }}
          FOLDER_CAMERA_STORE_PASSWORD: ${{ secrets.FOLDER_CAMERA_STORE_PASSWORD }}
          FOLDER_CAMERA_KEY_ALIAS: ${{ secrets.FOLDER_CAMERA_KEY_ALIAS }}
          FOLDER_CAMERA_KEY_PASSWORD: ${{ secrets.FOLDER_CAMERA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" && -n "$FOLDER_CAMERA_STORE_PASSWORD" &&
             -n "$FOLDER_CAMERA_KEY_ALIAS" && -n "$FOLDER_CAMERA_KEY_PASSWORD" ]] ||
            { echo "::error::Configure the four FOLDER_CAMERA signing secrets"; exit 1; }
          export FOLDER_CAMERA_KEYSTORE
          FOLDER_CAMERA_KEYSTORE=$(mktemp "$RUNNER_TEMP/folder-camera.XXXXXX")
          trap 'rm -f "$FOLDER_CAMERA_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$FOLDER_CAMERA_KEYSTORE"
          unset KEYSTORE_BASE64
          ./gradlew :app:assembleRelease --no-daemon --max-workers=4
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          cp "$apk" "$RUNNER_TEMP/folder-camera-android.apk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: folder-camera-android
          path: ${{ runner.temp }}/${{ github.event_name == 'push' && github.ref_type == 'tag' && 'folder-camera-android.apk' || 'folder-camera-test.apk' }}
          if-no-files-found: error

  windows:
    if: github.repository == 'Aleks1496/folder-camera'
    runs-on: [self-hosted, windows, x64, folder-camera-windows]
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Deno
        run: |
          set "DENO_DIR=${{ runner.tool_cache }}\folder-camera\deno-2.9.7-x64"
          python -c "import hashlib, io, os, pathlib, urllib.request, zipfile; dest = pathlib.Path(os.environ['DENO_DIR']); dest.mkdir(parents=True, exist_ok=True); archive = dest / 'deno.zip'; sha = 'a0c3101b4158d1dfb7d6a78a7bf0f3de80c96bb423c152beec8beb22786f2238'; data = archive.read_bytes() if archive.is_file() else b''; data = data if hashlib.sha256(data).hexdigest() == sha else urllib.request.urlopen('https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-pc-windows-msvc.zip', timeout=120).read(); assert hashlib.sha256(data).hexdigest() == sha, 'Deno archive checksum mismatch'; archive.write_bytes(data) if not archive.exists() or archive.read_bytes() != data else None; (dest / 'deno.exe').write_bytes(zipfile.ZipFile(io.BytesIO(data)).read('deno.exe'))"
          if errorlevel 1 exit /b 1
          python -c "import os; open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8').write(os.environ['DENO_DIR'] + '\n')"
      - working-directory: receiver
        run: deno task test
      - name: Build and validate portable Windows x64 EXE
        run: |
          python scripts/build_desktop.py --target x86_64-pc-windows-msvc --output .work/native
          if errorlevel 1 exit /b 1
          set "EXE=.work\native\folder-camera-receiver-windows-x64.exe"
          python -c "import os, pathlib; launchers = list(pathlib.Path('.work/native').glob('*.exe')); assert len(launchers) == 1, 'Expected one native receiver executable'; launchers[0].rename(os.environ['EXE'])"
          if errorlevel 1 exit /b 1
          python -c "import os, pathlib, struct; image = pathlib.Path(os.environ['EXE']).read_bytes(); assert image.startswith(b'MZ'), 'Missing DOS header'; offset, = struct.unpack_from('<I', image, 60); signature, machine = struct.unpack_from('<4sH', image, offset); assert signature == b'PE\x00\x00' and machine == 0x8664, 'Expected a Windows x64 executable'; print('Windows x64 PE header verified')"
          if errorlevel 1 exit /b 1
          python -c "import pathlib, shutil; out = pathlib.Path('.work/artifacts'); out.mkdir(exist_ok=True); shutil.make_archive(str(out / 'folder-camera-receiver-windows-x64'), 'zip', '.work/native')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: folder-camera-windows-x64
          path: .work/artifacts/folder-camera-receiver-windows-x64.zip
          if-no-files-found: error

  windows_gui:
    name: Windows GUI smoke test
    if: github.repository == 'Aleks1496/folder-camera'
    needs: windows
    runs-on: [self-hosted, windows, x64, folder-camera-windows-gui]
    timeout-minutes: 10
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: folder-camera-windows-x64
          path: .work/gui-artifact
      - name: Open the built receiver and verify readiness
        run: |
          python -m zipfile -e ".work/gui-artifact/folder-camera-receiver-windows-x64.zip" ".work/gui-runtime"
          if errorlevel 1 exit /b 1
          python scripts/smoke_desktop.py ".work/gui-runtime/folder-camera-receiver-windows-x64.exe"

  publish:
    if: github.repository == 'Aleks1496/folder-camera' && github.event_name == 'push' && github.ref_type == 'tag'
    needs: [android, windows_gui]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: folder-camera-*
          path: dist
          merge-multiple: true
      - name: Publish APK, portable Windows ZIP and checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files=(folder-camera-android.apk folder-camera-receiver-windows-x64.zip)
          sha256sum "${files[@]}" > SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "${files[@]}" SHA256SUMS
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
